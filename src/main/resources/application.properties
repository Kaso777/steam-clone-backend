spring.application.name=steam-clone-backend

# MySQL database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/steam_clone_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.secret=${JWT_SECRET:ZGV2LXNlY3JldC1jaGFuZ2UtbWUtMzItYnl0ZXMtbWluaW11bS1rZXk=}
jwt.expiration=604800000

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
